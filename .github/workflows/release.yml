name: Release

# Se lanza al subir una etiqueta v*, por ejemplo:  git tag v1.0.1 && git push origin v1.0.1
# Compila el APK de release firmado y lo publica en una release de GitHub con su suma SHA-256.
#
# Secretos del repositorio que necesita:
#   URSCREEN_KEYSTORE_BASE64    el .jks de firma, en Base64
#   URSCREEN_KEYSTORE_PASSWORD  contraseña del almacén
#   URSCREEN_KEY_ALIAS          alias de la clave
#   URSCREEN_KEY_PASSWORD       contraseña de la clave
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.URSCREEN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Falta el secreto URSCREEN_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Pruebas y APK de release
        env:
          URSCREEN_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          URSCREEN_KEYSTORE_PASSWORD: ${{ secrets.URSCREEN_KEYSTORE_PASSWORD }}
          URSCREEN_KEY_ALIAS: ${{ secrets.URSCREEN_KEY_ALIAS }}
          URSCREEN_KEY_PASSWORD: ${{ secrets.URSCREEN_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER" --stacktrace

      - name: Comprobar la firma y preparar los ficheros
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          NAME="URScreen-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "UR Screen $GITHUB_REF_NAME" \
            --generate-notes
